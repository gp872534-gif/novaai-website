
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        body {
            background: #10172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 100px 20px;
        }
        .box {
            background: #202b48;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
        }
        h1 { color: #a78bfa; }
        button {
            background: #8b5cf6;
            color: white;
            border: 0;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome to My Website!</h1>
        <p>This is my first GitHub hosted website.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="msg"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("msg").innerHTML =
                "Website is working successfully!";
        }
    </script>
</body>
</html>
